stages:
  - sync

github_push:
  stage: sync
  image: alpine:latest
  before_script:
    - apk add --no-cache git
  script:
    - if [ -z "$GITHUB_TOKEN" ]; then echo "GITHUB_TOKEN is not set"; exit 1; else echo "GITHUB_TOKEN is set successfully"; fi
    - if [ -z "$GITHUB_REPO" ]; then echo "GITHUB_REPO is not set"; exit 1; else echo "GITHUB_REPO is set successfully"; fi

    # 1. Construct the authenticated URL
    - GH_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git"

    # 2. Add GitHub as a remote named 'mirror'
    - git remote add mirror "$GH_URL" || git remote set-url mirror "$GH_URL"

    # 3. Push only the current branch changes
    # This ensures only the code that triggered the pipeline is sent
    - git push mirror HEAD:main --force

  when: manual
  only:
    - main
