stages:
  - test1
  - sync

typeCheck:
  stage: test1
  image: node:20-alpine
  script:
    - npm ci
    - npx tsc --noEmit

  when: manual
  only:
    - main

github_push:
  stage: sync
  image: alpine:latest
  needs: ["typeCheck"]
  before_script:
    - apk add --no-cache git
    # Setup identity so Git doesn't complain
    - git config --global user.email "$GITLAB_USER_EMAIL"
    - git config --global user.name "$GITLAB_USER_NAME"
  script:
    # 1. Validation
    - if [ -z "$GITHUB_TOKEN" ]; then echo "GITHUB_TOKEN is missing"; exit 1; else echo "GITHUB_TOKEN is set successfully"; fi
    - if [ -z "$GITHUB_REPO" ]; then echo "GITHUB_REPO is missing"; exit 1; else echo "GITHUB_REPO is set successfully"; fi

    # 2. Construct the authenticated URL
    - GH_URL="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPO}.git"

    # 3. Add GitHub as a remote
    - git remote add mirror "$GH_URL" || git remote set-url mirror "$GH_URL"

    # 4. Critical: Ensure we have the history to push
    - git fetch --unshallow || git fetch --all

    # 5. THE FIX: Use the full refname 'refs/heads/main'
    - git push mirror HEAD:refs/heads/main --force
  when: manual
  only:
    - main
